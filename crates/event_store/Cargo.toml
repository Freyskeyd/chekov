[package]
name = "event_store"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Crate to deal with every aspect of an eventstore"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
actix.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true

event_store-core.workspace = true

event_store-storage-inmemory = { workspace = true, optional = true }
event_store-backend-inmemory = { workspace = true, optional = true }
event_store-eventbus-inmemory = { workspace = true, optional = true }

event_store-storage-postgres = { workspace = true, optional = true }
event_store-backend-postgres = { workspace = true, optional = true }
event_store-eventbus-postgres = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
test-log.workspace = true
test-span.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["postgres", "inmemory"]
verbose = []

postgres = ["postgres_backend", "postgres_event_bus", "postgres_storage"]
postgres_storage = ["event_store-storage-postgres"]
postgres_backend = ["event_store-backend-postgres"]
postgres_event_bus = ["event_store-eventbus-postgres"]

inmemory = ["inmemory_backend", "inmemory_event_bus", "inmemory_storage"]
inmemory_storage = ["event_store-storage-inmemory"]
inmemory_backend = ["event_store-backend-inmemory"]
inmemory_event_bus = ["event_store-eventbus-inmemory"]
